defaults:
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: all

runner:
  task_type: sft
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: dual_yam_openpi_pi05_sft
    logger_backends: [tensorboard]
  max_epochs: -1
  max_steps: 30000
  val_check_interval: -1
  save_interval: 2000

data:
  train_data_paths: /path/to/finalized_yam_lerobot_dataset
  num_workers: 0

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 8
  seed: 0
  model:
    model_path: /path/to/pi05_base_pytorch
    action_dim: 14
    num_action_chunks: 10
    openpi:
      task: sft
      config_name: pi05_yam
      action_horizon: 10
      num_images_in_input: 3
      discrete_state_input: true
      torch_compile: false
    openpi_data:
      norm_stats_path: /path/to/yam/norm_stats.json
  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 30000
    lr_warmup_steps: 1000
    lr_scheduler: openpi_cosine
    num_cycles: 0.5
    min_lr: 2.5e-6
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: true
    gradient_checkpointing: false

validation:
  mode: data
  device: cpu
  steps: 1

reward:
  use_reward_model: false

critic:
  use_critic_model: false
