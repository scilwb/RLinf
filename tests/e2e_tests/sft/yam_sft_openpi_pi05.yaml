defaults:
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/sft/config

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-0

runner:
  task_type: sft
  max_epochs: -1
  max_steps: 2
  val_check_interval: -1
  save_interval: -1
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: test_yam_openpi_pi05
    logger_backends: null

data:
  train_data_paths: ${oc.env:YAM_SFT_DATASET}
  num_workers: 0

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 1
  seed: 0
  model:
    model_path: ${oc.env:YAM_SFT_MODEL_PATH}
    action_dim: 14
    num_action_chunks: 10
    openpi:
      task: sft
      config_name: pi05_yam
      action_horizon: 10
      num_images_in_input: 3
      discrete_state_input: true
      torch_compile: false
    openpi_data:
      norm_stats_path: ${oc.env:YAM_SFT_NORM_STATS}
  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 2
    lr_warmup_steps: 0
    lr_scheduler: openpi_cosine
    num_cycles: 0.5
    min_lr: 2.5e-6
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: true
    gradient_checkpointing: false
