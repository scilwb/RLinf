defaults:
  - env/yam_reach@env.train
  - env/yam_reach@env.eval
  - model/mlp_policy@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/embodiment/config

cluster:
  num_nodes: 1
  component_placement:
    actor,rollout: 0
    env:
      node_group: yam
      placement: 0
  node_groups:
    - label: yam
      node_ranks: 0
      hardware:
        type: DualYam
        configs:
          - node_rank: 0
            left_follower:
              channel: mock-can-left
              gripper_type: flexible_4310
              ee_mass: null
              gripper_limits: null
            right_follower:
              channel: mock-can-right
              gripper_type: flexible_4310
              ee_mass: null
              gripper_limits: null
            cameras:
              - name: top_rgb
                serial: MOCK0001
              - name: left_rgb
                serial: MOCK0002
              - name: right_rgb
                serial: MOCK0003

runner:
  task_type: embodied
  logger:
    log_path: /workspace/results/yam_mock_sac_mlp_reach
    project_name: rlinf
    experiment_name: ci-test
    logger_backends: [tensorboard]
  max_epochs: 2
  max_steps: -1
  only_eval: false
  val_check_interval: -1
  save_interval: -1

algorithm:
  update_epoch: 32
  group_size: 1
  agg_q: min
  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: token-mean
  bootstrap_type: always
  gamma: 0.8
  tau: 0.01
  entropy_tuning:
    alpha_type: softplus
    initial_alpha: 0.01
    target_entropy: -14
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0
  replay_buffer:
    enable_cache: true
    cache_size: 100
    sample_window_size: 100
    min_buffer_size: 0
    auto_save: true
  target_update_freq: 1

env:
  group_name: EnvGroup
  train:
    rollout_epoch: 1
    total_num_envs: 1
    override_cfg:
      is_dummy: false
      use_dense_reward: true
      max_num_steps: 10
      image_height: 48
      image_width: 64
    auto_reset: true
    ignore_terminations: true
    use_fixed_reset_state_ids: false
    max_episode_steps: 10
    max_steps_per_rollout_epoch: 10
  eval:
    rollout_epoch: 1
    total_num_envs: 1
    override_cfg:
      is_dummy: false
      image_height: 48
      image_width: 64

rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  collect_transitions: true
  collect_prev_infos: false
  model:
    model_path: ""
    precision: ${actor.model.precision}
  enable_torch_compile: true
  enable_cuda_graph: false

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 256
  global_batch_size: 256
  seed: 1234
  enable_offload: false
  model:
    model_type: mlp_policy
    model_path: ""
    action_dim: 14
    obs_dim: 14
    image_num: 0
    precision: "32"
    add_value_head: false
    add_q_head: true
  optim:
    clip_grad: 10.0
    lr: 3.0e-4
    lr_scheduler: torch_constant
  critic_optim:
    clip_grad: 10.0
    lr: 3.0e-4
    lr_scheduler: torch_constant
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false
critic:
  use_critic_model: false
